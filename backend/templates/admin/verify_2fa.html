{% extends "admin/base_site.html" %}
{% block content %}
<div style="max-width:400px; margin:40px auto">

  <div class="module" style="padding:30px">
    <h2 style="margin-top:0">Підтвердження входу</h2>
    <p>Введіть 6-значний код з Google Authenticator або Authy.</p>

    {% if error %}
      <p class="errornote">{{ error }}</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input
        type="text"
        name="code"
        maxlength="6"
        placeholder="000000"
        autofocus
        class="vTextField"
        style="font-size:28px; letter-spacing:10px; width:100%; text-align:center; margin:15px 0"
      >
      <div style="margin-top:15px">
        <button type="submit" class="default" style="width:100%">
          Підтвердити
        </button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
